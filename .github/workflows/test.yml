          call sdks\jc305u3_kit\bin\verifycap.bat -nobanner -outfile applet.hash "%EXP%\java\lang\javacard\lang.exp" "%EXP%\javacard\framework\javacard\framework.exp" "%EXP%\javacard\security\javacard\security.exp" "%EXP%\javacardx\crypto\javacard\crypto.exp" build\javacard\org\satochip\applet\javacard\applet.cap
          dir applet.hash
          call sdks\jc305u3_kit\bin\scriptgen.bat -nobanner -nobeginend -hashfile applet.hash -o cap.scr build\javacard\org\satochip\applet\javacard\applet.cap
          dir cap.scr
      - name: BASELINE - Assemble the APDU script
        shell: bash
        run: |
