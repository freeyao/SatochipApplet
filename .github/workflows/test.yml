            echo '// select it: the response is the GET_STATUS payload'
            echo '0x00 0xA4 0x04 0x00 0x09 0x53 0x61 0x74 0x6F 0x43 0x68 0x69 0x70 0x00 0x7F;'
            echo '// GET_STATUS'
            echo '0xB0 0x3C 0x00 0x00 0x00 0x7F;'
            echo 'powerdown;'
          } > run.scr
          grep -c . cap.scr; head -5 cap.scr; tail -3 run.scr
      - name: BASELINE - Run on cref
        shell: cmd
