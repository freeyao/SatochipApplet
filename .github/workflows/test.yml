name: build and test

# SCRATCH BRANCH ONLY (betternonce-cref): tries the CAP on Oracle's reference implementation
# (cref, JavaCard 3.0.5u3 kit, Windows binary from the sdks submodule). Not for merging.
on:
  workflow_dispatch:

jobs:
  cref:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the CAP
        shell: bash
        run: ./gradlew --no-daemon convertJavacard && ls -l build/javacard/org/satochip/applet/javacard/applet.cap
      - name: Script the CAP download
        shell: cmd
        run: |
          set JC_HOME=%CD%\sdks\jc305u3_kit
          set EXP=%JC_HOME%\api_export_files
          call sdks\jc305u3_kit\bin\verifycap.bat -help
          dir /s /b "%EXP%\*.exp" | findstr /i "java\\lang javacard\\framework javacard\\security javacardx\\crypto"
          call sdks\jc305u3_kit\bin\verifycap.bat -nobanner -outfile applet.hash "%EXP%\java\lang\javacard\lang.exp" "%EXP%\javacard\framework\javacard\framework.exp" "%EXP%\javacard\security\javacard\security.exp" "%EXP%\javacardx\crypto\javacard\crypto.exp" build\javacard\org\satochip\applet\javacard\applet.cap
          dir applet.hash
          call sdks\jc305u3_kit\bin\scriptgen.bat -nobanner -nobeginend -hashfile applet.hash -o cap.scr build\javacard\org\satochip\applet\javacard\applet.cap
          dir cap.scr
      - name: Assemble the APDU script
        shell: bash
        run: |
          {
            echo 'powerup;'
            echo '// select the installer applet'
            echo '0x00 0xA4 0x04 0x00 0x09 0xa0 0x00 0x00 0x00 0x62 0x03 0x01 0x08 0x01 0x7F;'
            echo '// CAP begin'
            echo '0x80 0xB0 0x00 0x00 0x00 0x7F;'
            cat cap.scr
            echo '// CAP end'
            echo '0x80 0xBA 0x00 0x00 0x00 0x7F;'
            echo '// create the Satochip applet instance (AID 5361746F4368697000, no parameters)'
            echo '0x80 0xB8 0x00 0x00 0x0b 0x09 0x53 0x61 0x74 0x6F 0x43 0x68 0x69 0x70 0x00 0x00 0x7F;'
            echo '// select it: the response is the GET_STATUS payload'
            echo '0x00 0xA4 0x04 0x00 0x09 0x53 0x61 0x74 0x6F 0x43 0x68 0x69 0x70 0x00 0x7F;'
            echo '// GET_STATUS'
            echo '0xB0 0x3C 0x00 0x00 0x00 0x7F;'
            echo 'powerdown;'
          } > run.scr
          grep -c . cap.scr; head -5 cap.scr; tail -3 run.scr
      - name: Run on cref
        shell: cmd
        run: |
          set JC_HOME=%CD%\sdks\jc305u3_kit
          start /b sdks\jc305u3_kit\bin\cref_t1.exe -e -o eeprom.out > cref.log 2>&1
          ping -n 4 127.0.0.1 > nul
          call sdks\jc305u3_kit\bin\apdutool.bat -o apdu.out run.scr
          ping -n 3 127.0.0.1 > nul
          echo ==== cref.log
          type cref.log
          exit /b 0
      - name: Show the last responses
        shell: bash
        run: |
          echo "responses with a status other than 9000:"; grep -v 'SW1: 90, SW2: 00' apdu.out | grep 'SW1' | tail -20 || true
          echo "last 6 exchanges:"; grep 'SW1' apdu.out | tail -6 | cut -c1-400
      - name: BASELINE v0.16-0.1 - build the CAP
        shell: bash
        run: git fetch --depth 1 origin 048d789af6581d0391a1581358f28db0c4915230 || git fetch --unshallow origin; git checkout 048d789 -- src/main && ./gradlew --no-daemon convertJavacard && ls -l build/javacard/org/satochip/applet/javacard/applet.cap
      - name: BASELINE - Script the CAP download
        shell: cmd
        run: |
          set JC_HOME=%CD%\sdks\jc305u3_kit
          set EXP=%JC_HOME%\api_export_files
          call sdks\jc305u3_kit\bin\verifycap.bat -help
